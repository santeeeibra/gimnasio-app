<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Destacadas SysGym</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333}
section{width:1080px;height:1920px;position:relative;overflow:hidden;margin-bottom:40px;
 background:radial-gradient(circle at 50% 50%,#123a2e 0%,#07090d 45%);display:flex;align-items:center;justify-content:center}
.ring{width:860px;height:860px;border-radius:50%;border:12px solid #10e7a0;box-shadow:0 0 80px rgba(16,231,160,.4),inset 0 0 70px rgba(16,231,160,.2);display:flex;align-items:center;justify-content:center}
svg{width:480px;height:480px;fill:none;stroke:#10e7a0;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 18px rgba(16,231,160,.5))}
</style></head><body>
<!-- Cómo funciona: celular -->
<section id="d1-como-funciona"><div class="ring"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/><path d="M10 9.5l4 2.5-4 2.5z"/></svg></div></section>
<!-- Precios: etiqueta -->
<section id="d2-precios"><div class="ring"><svg viewBox="0 0 24 24"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div></section>
<!-- Rutinas: mancuerna -->
<section id="d3-rutinas"><div class="ring"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/></svg></div></section>
<!-- App del socio: QR -->
<section id="d4-app-del-socio"><div class="ring"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg></div></section>
<!-- Contacto: mensaje -->
<section id="d5-contacto"><div class="ring"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></div></section>
</body></html>
