<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Perfil SysGym</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#333}
section{width:1080px;height:1080px;position:relative;overflow:hidden;margin-bottom:40px}
.a{background:radial-gradient(circle at 50% 42%,#123a2e 0%,#07090d 62%)}
.a::before{content:"";position:absolute;z-index:0;inset:60px;border-radius:50%;border:14px solid #10e7a0;box-shadow:0 0 80px rgba(16,231,160,.45),inset 0 0 80px rgba(16,231,160,.25)}
.b{background:#10e7a0}
.c{background:#07090d}
img{position:absolute}
</style></head><body>
<!-- A: Volt sobre oscuro con aro verde -->
<section class="a" id="perfil-a"><img src="img/pulpo-saludo.png" style="width:1080px;left:40px;top:70px;z-index:1"></section>
<!-- C: ícono de la app -->
<section class="c" id="perfil-c"><img src="img/icono.png" style="width:1080px;left:0;top:0"></section>
</body></html>
